# НАКАЗ «Робочий» — не придуманий, а ВИМІРЯНИЙ на арені (src/arena-orders.ts).
#
# Що показав перебір (600 матчів на варіант, чесне дзеркало):
#
#   50.5%  resourceWithin:8 -> seekResource, інакше seekCenter   <- цей
#   50.0%  просто seekResource                                    (baseline)
#   21.2%  enemyWithin:1 -> flee, інакше seekResource
#   13.7%  enemyWithin:2 -> flee, інакше seekResource
#    1.2%  enemyWithin:2 -> chaseEnemy, інакше seekResource
#    0.0%  tickAfter:40 -> seekResource, інакше seekCenter
#
# Головний висновок, і він контрінтуїтивний: «розумні» правила
# (тікати від суперника, ганятись за ним) — КАТАСТРОФІЧНО погані.
# Кожен хід убік від ресурсу коштує тік, а тіки — це і є рахунок.
# Виграш над baseline тут у межах похибки: словник Наказу навмисно
# бідний, і витиснути з нього багато неможливо. Зате втратити — легко.
#
# ПРАВИЛА ЧИТАЮТЬСЯ ЗГОРИ ВНИЗ, ПЕРШЕ ВЛУЧАННЯ ВИГРАЄ.
name: Робочий
rules:
  # Є ресурс у досяжності — беремо. Поріг 8 підібраний перебором:
  # 3 і 5 помітно гірші, 12 і «без порогу» — те саме, що baseline.
  - when: { resourceWithin: 8 }
    do: seekResource

  # Поле порожнє — стоїмо в центрі, звідки до наступного спавну
  # у середньому найближче. Це єдине, що дає перевагу над baseline.
  - when: always
    do: seekCenter
